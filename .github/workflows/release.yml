name: release

# Publishes to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (OIDC): no API token is stored in the repo.
# One-time setup on pypi.org: add a trusted publisher for project
# "langchain-geekflare" -> owner "geekflare", repo "langchain-geekflare",
# workflow "release.yml", environment "pypi".

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e . --group test
      - run: uv run --no-sync pytest --disable-socket --allow-unix-socket tests/unit_tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
